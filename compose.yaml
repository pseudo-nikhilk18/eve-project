services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eve"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: ./backend
    command: ["node", "db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/eve
    depends_on:
      database:
        condition: service_healthy

  seed:
    build:
      context: ./backend
    command: ["node", "db/seed.js"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/eve
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/eve
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-before-deployment}
      PORT: 3000
    depends_on:
      database:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
